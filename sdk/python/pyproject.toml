[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nodvard-sdk"
version = "0.1.0"
description = "Der stabile Vertrag zwischen dem Nodvard-Deck-Kern und Extensions."
requires-python = ">=3.12"
license = "PolyForm-Noncommercial-1.0.0"
authors = [{ name = "Nico Benks" }]
dependencies = [
    "pydantic>=2.7",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["nodvard_sdk*"]
