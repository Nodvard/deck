<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <title>Nodvard Deck Terminal-Verifikation (WP-4, nicht Teil der Produkt-UI)</title>
  <link rel="stylesheet" href="/src/terminal-test.css" />
</head>
<body>
  <h1>WP-4 Terminal-Verifikation (Standalone, kein Teil des Produkt-Frontends)</h1>
  <p>Kein Login/Routing existiert im Frontend noch (das kommt erst mit WP-7) -- diese
     Seite spricht die API direkt an, um die WS-Terminal-Strecke Ende-zu-Ende mit
     echtem xterm.js in einem echten Browser zu beweisen.</p>
  <div>
    <input id="username" placeholder="username" value="admin" />
    <input id="password" placeholder="password" type="password" value="correct-horse-battery" />
    <input id="hostId" placeholder="host_id" />
    <button id="connect">Verbinden</button>
  </div>
  <div id="status">Bereit.</div>
  <div id="term"></div>

  <script type="module" src="/src/terminal-test.js"></script>
</body>
</html>
