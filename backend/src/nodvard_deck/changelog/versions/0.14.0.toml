text = "Nodvard KI kann neben Ollama auch OpenAI-kompatible Anbieter nutzen, mit Ersatzmodell, Verbindungstest und einem Hinweis, wenn Daten dein Netz verlassen."

[[entries]]
kind = "dokumentation"
text = "Die Shield-Anleitung erklärt auf Deutsch und Englisch, wie du einen Anbieter einrichtest, den Zugang im Tresor hinterlegst und die Verbindung prüfst."

[[entries]]
kind = "behoben"
text = "Leere Textdateien lassen sich wieder ohne Fehlermeldung in der Vorschau öffnen."

[[entries]]
kind = "sicherheit"
text = "Fail2ban lässt sich über Ausnahmen nicht mehr praktisch abschalten: zu große Adressbereiche und Sperrzeiten unter einer Minute werden abgelehnt."

[[entries]]
kind = "sicherheit"
text = "Das Signieren einer Release-Freigabe bricht ab, wenn die verlangte Herkunftsprüfung nicht möglich ist."

[[entries]]
kind = "sicherheit"
text = "Das Deck-Image bringt beim Bauen die aktuellen Debian-Sicherheitsupdates mit, damit auch Systembibliotheken wie zlib auf dem neuesten Stand sind."

[[entries]]
kind = "behoben"
text = "Ausgeschaltete Module verschwinden sofort aus Seitenleiste, Übersicht und Suche, auch beim Ausschalten in einer anderen Sitzung."

[[entries]]
kind = "neu"
text = "Freiwillige Nutzungsdaten in drei Stufen, standardmäßig aus"

[[entries]]
kind = "behoben"
text = "Logo, Favicon und App-Symbole lassen sich wieder auf fremden Startseiten einbinden. Andere API-Antworten behalten die strengen Sicherheits-Kopfzeilen."

[[entries]]
kind = "sicherheit"
text = "Beim Umzug aus Portainer bleiben geheime Werte auch in Fehlermeldungen zu Images und Dateipfaden verborgen."

[[entries]]
kind = "sicherheit"
text = "Volume-Sicherungen brechen ab, wenn noch laufende Container auf dem Server die betroffenen Volumes nutzen oder diese Prüfung fehlschlägt."

[[entries]]
kind = "sicherheit"
text = "Beim Löschen eines Stack-Ordners bleiben Konfigurationsdateien anderer laufender oder übernommener Stacks geschützt."

[[entries]]
kind = "behoben"
text = "Fehlgeschlagene oder unvollständige Update-Abfragen zeigen einen Fehler und behalten den letzten erfolgreichen Stand samt Prüfzeitpunkt."

[[entries]]
kind = "behoben"
text = "Das Löschen einer Datei aus der Quarantäne meldet bei einem Löschfehler keinen Erfolg mehr."

[[entries]]
kind = "behoben"
text = "Shield unterscheidet bei Vorfällen und Erholungen auch Container, deren Namen sich nur durch Groß- und Kleinschreibung unterscheiden."

[[entries]]
kind = "behoben"
text = "Beim Umwandeln eines Containers in einen Stack bleibt seine Einstellung für den gemeinsam nutzbaren Speicherbereich erhalten."

[[entries]]
kind = "sicherheit"
text = "Portainer-Umzüge und Container-Umwandlungen brechen vor dem Schreiben ab, wenn sich der Zielordner seit der Freigabe geändert hat."

[[entries]]
kind = "behoben"
text = "Importreihenfolge der öffentlichen API für die Ruff-Prüfung korrigiert."

[[entries]]
kind = "behoben"
text = "Auch mit eingeschränkten Zugriffsrechten meldet das Löschen aus der Quarantäne Fehler zuverlässig."

[[entries]]
kind = "behoben"
text = "Weitere Stacks aus Portainer oder unbekannter Herkunft lassen die Löschprüfung nicht mehr abstürzen. Fehlen Dateiangaben, erklärt Deck, warum der Ordner bleiben muss."

[[entries]]
kind = "sicherheit"
text = "Deck und die Notseite geben beim Öffnen fremder Seiten keine Adressdaten weiter; die Notseite liefert nun ebenfalls die Kopfzeile für dauerhaft verschlüsselte Verbindungen."

[[entries]]
kind = "verbessert"
text = "Ein Test sichert ab, dass eine Sicherung mit nicht passenden Prüfsummen beim Wiederherstellen abgelehnt wird."

[[entries]]
kind = "verbessert"
text = "Ein Test prüft jetzt wirklich, dass beim Prüfen einer Sicherung keine Nebendateien der Datenbank angelegt werden."

[[entries]]
kind = "behoben"
text = "Nodvard Shield: Beim Ändern der Fail2ban-Einstellungen bleiben aktive Schutzregeln ausgewählt und Virenscans auf demselben Server laufen weiterhin nacheinander."

[[entries]]
kind = "behoben"
text = "Der Rückweg zur vorherigen Version behält den eingestellten Container-Nutzer auch dann bei, wenn die neue Version denselben Nutzer vorgibt."

[[entries]]
kind = "dokumentation"
text = "Die Installationsanleitungen für Unraid, CasaOS und ZimaOS erklären die nötigen Besitzrechte am Datenordner vor dem ersten Start."

[[entries]]
kind = "sicherheit"
text = "Zu jeder neuen Version gibt es Bausteinlisten und prüfbare Herkunftsnachweise für Deck, Dock und den Update-Helfer."

[[entries]]
kind = "sicherheit"
text = "Hand-Server mit ausstehender SSH-Schlüsselbestätigung werden erst nach der Bestätigung automatisch zugeordnet, damit vergessene Schlüssel nicht wieder vertraut werden."

[[entries]]
kind = "behoben"
text = "Wartungsfenster mit ausgewählten Servern gelten auch nach deren Zusammenführung weiter."

[[entries]]
kind = "behoben"
text = "Beim Zusammenführen von Servern bleiben der bestätigte Stand des Datei-Wächters und die Ziele vorhandener Skripte erhalten."

[[entries]]
kind = "sicherheit"
text = "Beim Zusammenführen von Servern werden gleiche SSH-Schlüssel nur einmal übernommen. Unterschiedliche Schlüssel verhindern die automatische Zuordnung. Beim Vergessen eines Schlüsseltyps werden alle zugehörigen Schlüssel entfernt."

[[entries]]
kind = "behoben"
text = "Nicht mehr vorhandene Gäste werden neuen Hand-Servern mit wiederverwendeten Adressen nicht mehr automatisch zugeordnet."

[[entries]]
kind = "verbessert"
text = "Hand-Server und Proxmox-Knoten oder Gäste mit gleicher Adresse oder gleichem Hostnamen erscheinen gemeinsam. Der Hand-Eintrag bleibt zugeordnet; Proxmox-Zustand und SSH-Messwerte stehen zusammen. Eine rückgängig machbare Migration übernimmt bestehende Markierungen, Zugänge und Verläufe."

[[entries]]
kind = "behoben"
text = "Server-Zustand behält nach einem Ansichtswechsel den aktuellen Verbindungsstatus bei, auch wenn eine ältere Abfrage später antwortet."

[[entries]]
kind = "sicherheit"
text = "Nodvard Shield begrenzt Größe und Wartezeit externer Anbieterantworten, damit fehlerhafte Server Deck nicht blockieren."

[[entries]]
kind = "neu"
text = "Shield gleicht installierte Pakete je Server mit öffentlichen Sicherheitsmeldungen ab und zeigt betroffene Pakete, CVEs, Schwere und behobene Versionen mit einem Link zur Update-Zentrale. Paketlisten bleiben in Deck."

[[entries]]
kind = "neu"
text = "Shield prüft aus dem Heimnetz (von Deck aus, nicht aus dem Internet) offene TCP-Ports und HTTPS-Zertifikate. Die Karten warnen vor neu offenen Ports, bald ablaufenden, selbstsignierten oder unpassenden Zertifikaten und schwachen TLS-Protokollen. Beide Prüfungen laufen lesend nach Zeitplan; die Außenprüfung lässt sich abschalten."

[[entries]]
kind = "behoben"
text = "Shields CVE-Abgleich kann die installierten Pakete wieder lesen und wertet verneinte Verweise in RHEL-Sicherheitsregeln richtig aus."

[[entries]]
kind = "behoben"
text = "Nodvard Shield erkennt das Hilfsskript mit der korrigierten SSH-Abfrage auf Servern als neue Version."

[[entries]]
kind = "behoben"
text = "Shield ordnet Neustarts bei Containernamen mit unterschiedlicher Groß- und Kleinschreibung richtig zu, sodass die Ruhezeit und Hinweise bei erneuten Abstürzen stimmen."

[[entries]]
kind = "sicherheit"
text = "Nodvard Shield begrenzt auch bei Ollama die Größe und Gesamtdauer der Antworten für Modellanfragen und Modelllisten."

[[entries]]
kind = "behoben"
text = "Nodvard Shield übernimmt lesbare Update-Listen auch bei Zeitüberschreitungen einzelner Paketquellen und verwechselt Paketnamen nicht mehr mit Schäden an der Paketverwaltung."

[[entries]]
kind = "sicherheit"
text = "Die Ausgabe beim Laden der Paketquellen ist begrenzt und zeigt keine Zugangsdaten aus Quellenadressen mehr an."

[[entries]]
kind = "behoben"
text = "Shield lässt sich mit der SSH-Härtung wieder aktivieren. Die Vorbereitung einer Härtungsaktion verlangt weiterhin die Rechte für Shield-Verwaltung und Serverausführung."

[[entries]]
kind = "behoben"
text = "Das Shield-Frontend enthält die Sicherheitsprüfungen je Server und die beschrifteten Paketlisten für das Handy gemeinsam."

[[entries]]
kind = "behoben"
text = "Nodvard Shield liest die SSH-Einstellungen auch bei neueren Servern mit anderer Groß- und Kleinschreibung und zeigt bei fehlgeschlagenen Abfragen den Fehlergrund an."

[[entries]]
kind = "sicherheit"
text = "Shield kann SSH je Server auf Schlüsselanmeldung umstellen. Passwortanmeldungen werden gesperrt, Root-Zugänge deutlich gekennzeichnet. Eine neue Verbindung prüft den Zugang; bei einem Fehler wird die Änderung zurückgenommen. Schlüssel eintragen und Härtung zurücknehmen sind eigene Aktionen mit Freigabe und Protokoll."

[[entries]]
kind = "sicherheit"
text = "Die SSH-Härtung warnt vor dem Aussperren und wird bei Servern mit Zwei-Faktor-Anmeldung oder Passwort-Standardzugang nicht angeboten. Die Rücknahme nach 60 Sekunden läuft als eigene Systemeinheit, und eine nach einem Neustart unbestätigte Härtung wird vor dem Start von SSH zurückgenommen."

[[entries]]
kind = "behoben"
text = "Shield trägt neue root-Schlüssel auch auf Proxmox in die gemeinsame Schlüsseldatei des Clusters ein."

[[entries]]
kind = "behoben"
text = "SSH härten sperrt root nicht mehr aus, wenn für root schon Schlüssel eingetragen sind: Die Anmeldung mit Schlüssel bleibt dann erlaubt, gesperrt wird nur das Passwort."

[[entries]]
kind = "sicherheit"
text = "Shield bestätigt die SSH-Härtung nur, wenn bedingte Passwortausnahmen ausgeschlossen sind."

[[entries]]
kind = "behoben"
text = "SSH-Schlüssel mit Kommentar funktionieren. Neue Schlüssel lassen sich mit einem vorhandenen Zugang eintragen, und langsame SSH-Verbindungen blockieren die Datenbank nicht mehr."

[[entries]]
kind = "behoben"
text = "Shield verlangt zum Eintragen eines neuen Deck-Schlüssels einen bestehenden Zugang und zeigt den nötigen Schritt an."

[[entries]]
kind = "sicherheit"
text = "Kann Shield die SSH-Härtungsdatei nicht entfernen, meldet es die Rücknahme als fehlgeschlagen und behält den automatischen Rückweg bei."

[[entries]]
kind = "behoben"
text = "Nodvard Shield behält Fehlermeldungen beim Laden der Paketquellen auch nach langen Ausgaben und zeigt offene Updates neben fehlgeschlagenen Prüfungen in der Kurzlage."

[[entries]]
kind = "behoben"
text = "Nodvard Shield übernimmt lesbare Update-Listen auch bei nicht erreichbaren Paketquellen und zeigt den Quellenfehler als Hinweis."

[[entries]]
kind = "behoben"
text = "Die Kurzlage von Nodvard Shield zeigt offene Sicherheitsupdates auch dann, wenn zugleich Update-Prüfungen fehlgeschlagen sind."

[[entries]]
kind = "behoben"
text = "Nodvard Shield zeigt bei fehlgeschlagenen Update-Prüfungen den Grund und den nächsten Schritt, statt fehlende Unterstützung oder einen aktuellen Stand zu melden."

[[entries]]
kind = "sicherheit"
text = "Laufende Shield-Anfragen senden gespeicherte Zugangsdaten bei einem Adresswechsel nicht an den neuen Ersatzserver."

[[entries]]
kind = "behoben"
text = "Automatische Shield-Statusabfragen teilen sich einen Verbindungstest für fünf Minuten."

[[entries]]
kind = "behoben"
text = "Shield merkt und protokolliert auch fehlgeschlagene Modelltests für die Moduleinstellungen."

[[entries]]
kind = "behoben"
text = "Shield prüft die Antwort des gespeicherten Modells und bei Bedarf den Ersatzserver. Modulverwalter können die Verbindung testen; Fehler beim Test werden zuverlässig angezeigt."

[[entries]]
kind = "behoben"
text = "Shield gibt Datenbankverbindungen vor Anfragen an selbst eingerichtete Anbieter frei."

[[entries]]
kind = "sicherheit"
text = "Auch die Verbindungstests in Shield teilen sich die Grenze von zehn Tests je Minute und Nutzer mit den Moduleinstellungen."

[[entries]]
kind = "sicherheit"
text = "Sicherheitsabfragen für Konten und die Erneuerung von Sitzungen werden zusätzlich je Adresse begrenzt. Die Notfallseite zählt falsche Codes aus einem IPv6-Netz zusammen."

[[entries]]
kind = "sicherheit"
text = "Dokumente und Inventarbilder werden beim Hochladen auf ihren Dateityp geprüft. Downloads im Dateimanager erhalten eine eigene Browser-Sandbox."

[[entries]]
kind = "sicherheit"
text = "Unerwartete Fehler erhalten eine Fehlerkennung statt fremder Fehlertexte. WebSocket-Tickets werden im Zugriffsprotokoll ausgeblendet."

[[entries]]
kind = "sicherheit"
text = "Ungültige Anmeldetokens hinter einem gemeinsamen Proxy sperren die Sitzungserneuerung der anderen Nutzer nicht mehr aus; die Adressgrenze zählt nur Fehlversuche."

[[entries]]
kind = "sicherheit"
text = "Abgemeldete und abgelaufene Refresh-Tokens belasten das Kontolimit zur Sitzungserneuerung nicht mehr. Andere gültige Sitzungen bleiben dadurch nutzbar."

[[entries]]
kind = "behoben"
text = "Nach drei abgelehnten SSH-Anmeldungen pausiert Deck weitere Versuche für diesen Server zunächst 30 Minuten und bei weiteren Fehlern bis zu sechs Stunden. Die Pause bleibt nach einem Neustart erhalten und endet mit „Jetzt erneut prüfen“ oder einer erfolgreichen Prüfung des Standard-Zugangs. „Verbindung prüfen“ bleibt jederzeit nutzbar."

[[entries]]
kind = "sicherheit"
text = "SSH-Freigaben verlangen einen eindeutigen Server. Pfad und Query müssen übereinstimmen; Aktionen ohne Serverbezug und geplante Jobs erhalten keine pauschale Freigabe. Sammelabfragen öffnen begrenzte Zugriffe je Server. Engere Lesekontexte gelten auch innerhalb laufender Aktionen."

[[entries]]
kind = "behoben"
text = "Fail2ban-Einstellungen lassen sich wieder vorschlagen und mit voller Automatik speichern. Fehlt die eindeutige Zuordnung eines Metrikanbieters, bleibt eine Messlücke; der Einzelabruf meldet den Anbieter als nicht verfügbar."

[[entries]]
kind = "behoben"
text = "Die Server-Einrichtung installiert Hilfsskripte auch für root, ohne sudo-Regeln anzulegen. Die SSH-Härtung konfiguriert ihre Wiederholungssperre über den allgemeinen Aktionsvertrag."

[[entries]]
kind = "behoben"
text = "Bleibt nach einer fehlenden Bestätigungsantwort die SSH-Härtung aktiv, meldet Shield die Rücknahme als unbestätigt und empfiehlt eine Statusprüfung."

[[entries]]
kind = "behoben"
text = "Scheitert das Zurücknehmen der SSH-Härtung, bleibt die bisherige Einstellung erhalten und die Rücknahme kann erneut versucht werden."

[[entries]]
kind = "sicherheit"
text = "SSH-Sitzungen zur Einrichtung und Härtung prüfen den Freigabekontext vor dem Verbindungsaufbau, jedem Befehl und der Schlüsselgegenprobe. Statusabfragen und Vorprüfungen verwenden auf den Server begrenzte Zugriffe."

[[entries]]
kind = "behoben"
text = "Die Wiederholungssperre für SSH-Härtungsaktionen greift auch bei neuen Rücknahme-Token. Der automatische Rückweg wird mit einem echten Kindprozess geprüft."

[[entries]]
kind = "dokumentation"
text = "Die Tailscale-Anleitung stellt klar, dass du die IP für den Verbindungstest auf dem Zielserver ermittelst."

[[entries]]
kind = "behoben"
text = "Pi-hole meldet leere oder unpassende Antworten als Verbindungsproblem, statt eine erfolgreiche Abfrage anzuzeigen."

[[entries]]
kind = "sicherheit"
text = "Deck signiert Anforderungen an den Update-Helfer, Update wie Rückweg, mit einem eigenen Schlüssel je Installation. Der Update-Helfer verlangt eine gültige Anforderung, für ein Update zusätzlich die Release-Freigabe, und lehnt fehlende, gefälschte, wiederholte und abgelaufene Signaturen ab."

[[entries]]
kind = "behoben"
text = "Ein Update-Helfer ohne Prüfung signierter Anforderungen sperrt jetzt den Knopf für Update und Rückweg mit Grund, statt den Klick mit einem Fehler zu beantworten. Die Fehlertexte nennen den Schlüssel der Installation als mögliche Ursache. Ein Schlüssel mit liegengebliebenem Temp-Namen wird beim nächsten Einrichten wieder brauchbar."

[[entries]]
kind = "behoben"
text = "Fehler beim Erstellen oder Schreiben einer Update-Anforderung werden nicht mehr als fehlender Schlüssel gemeldet."

[[entries]]
kind = "behoben"
text = "Die Update-Zentrale zeigt bei einer fehlgeschlagenen Suche ohne bekannte Version auch in der Kopfzeile den Fehler an."

[[entries]]
kind = "behoben"
text = "Volume-Sicherungen werden auch bei Heimatordnern mit abschließendem Schrägstrich und beim Heimatordner / richtig angelegt und angezeigt."

[[entries]]
kind = "behoben"
text = "Abgebrochene Wächter-Läufe verkürzen das Suchfenster des nächsten Scans nicht mehr, auch wenn sie noch auf einen freien Scanplatz gewartet haben."

[[entries]]
kind = "behoben"
text = "Das Warten auf laufende Aktionen und auf einen Neustart hält sein Zeitlimit auch dann ein, wenn der Server eine Antwort nicht zu Ende schickt."

[[entries]]
kind = "behoben"
text = "Wiederherstellen: „Weiter warten“ erkennt jetzt auch einen Neustart, der schon vor dem Klick abgeschlossen war."

[[entries]]
kind = "behoben"
text = "Sicherung: Scheitert eine Statusabfrage während einer laufenden Sicherung, fragt die Seite weiter nach, statt dauerhaft „Sicherung läuft“ zu zeigen."

[[entries]]
kind = "verbessert"
text = "Wer die Zwei-Faktor-Anmeldung bei der Einrichtung überspringt, findet einen direkten Link zu den Kontoeinstellungen und eine Erinnerung auf der Übersicht, bis die Anmeldung abgesichert oder der Hinweis ausgeblendet ist."
