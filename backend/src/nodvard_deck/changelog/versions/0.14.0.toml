version = "0.14.0"
date = "2026-11-13"

[[entries]]
kind = "dokumentation"
text = "Englische Versionshinweise für die Versionen 0.13.0, 0.12.1 und 0.12.0 hinzugefügt."

[[entries]]
kind = "dokumentation"
text = "Die Anleitungen zur Erst-Einrichtung und Installation berücksichtigen jetzt die Neuerungen aus Version 0.13."

[[entries]]
kind = "dokumentation"
text = "Häufige Fragen zu Docker-Netzen, Images und Vorlagen sowie Hilfe zu den Meldungen der Update-Zentrale ergänzt."

[[entries]]
kind = "verbessert"
text = "Beim Anlegen eines neuen Stacks ist nur noch „Anlegen“ hervorgehoben, „Vorlage speichern“ ist ein schlichter Knopf in gleicher Höhe."

[[entries]]
kind = "dokumentation"
text = "Die Anleitung für Vorlagen beschreibt jetzt auch eigene Stack-Vorlagen, das Speichern aus bestehenden Dateien und die Prüfung auf Passwörter."

[[entries]]
kind = "dokumentation"
text = "Anleitung zur Anbindung von Servern mit Zwei-Faktor-Authentifizierung per SSH hinzugefügt."

[[entries]]
kind = "dokumentation"
text = "Häufige Fragen zur Lizenz und zur privaten Nutzung sind in der Dokumentation zusammengefasst."

[[entries]]
kind = "dokumentation"
text = "Hilfe zur Fehlersuche für häufige Probleme bei Erst-Einrichtung und Betrieb hinzugefügt."

[[entries]]
kind = "dokumentation"
text = "Abnahme-Checklisten für den Test am echten Gerät für die Module Pi-hole, Plex und Synology hinzugefügt."

[[entries]]
kind = "behoben"
text = "Zu große Seitenangaben beim Abrufen der Aktionen, des Protokolls, der Meldungen und der Shield-Historie werden als ungültige Eingabe abgewiesen und lösen keinen internen Fehler mehr aus."
prs = [685]

[[entries]]
kind = "sicherheit"
text = "Nach 30 falschen Passwörtern für einen Benutzernamen in fünf Minuten werden weitere Anmeldeversuche aus fremden Netzen vorübergehend gesperrt, auch bei wechselnden Adressen und IPv6-Netzen."

[[entries]]
kind = "sicherheit"
text = "Wer deinen Benutzernamen kennt, kann dich mit falschen Passwörtern aus dem Internet nicht mehr aus dem Heimnetz oder VPN aussperren. Die Sperre nach 30 Fehlversuchen gilt nur noch für fremde Netze."

[[entries]]
kind = "sicherheit"
text = "Eine noch laufende Erneuerung der Anmeldung meldet nach dem Abmelden nicht wieder an und meldet ein inzwischen neu angemeldetes Konto nicht mehr ab."

[[entries]]
kind = "sicherheit"
text = "Endet die Anmeldung, während ein Bestätigungsdialog (etwa zum Löschen) offen ist, gilt er als abgebrochen und lässt sich nach der Anmeldung eines anderen Kontos nicht mehr bestätigen."

[[entries]]
kind = "behoben"
text = "Ein auf einzelne Server beschränktes Recht verdeckt in der Oberfläche kein zusätzlich vergebenes allgemeines Recht mehr."

[[entries]]
kind = "behoben"
text = "In der API-Beschreibung sind die Antworttypen der Wochenberichte und weitere Fehlermeldungen für Shield, Proxmox und Backups ergänzt."

[[entries]]
kind = "behoben"
text = "Die Schnittstellen für Apps und Erweiterungen bleiben auch ohne Nutzung durch die Web-Oberfläche erhalten und sind jetzt ausdrücklich dokumentiert."

[[entries]]
kind = "behoben"
text = "Nicht erlaubte API-Methoden liefern auch bei eingebundenen Routern und ausgeliefertem Frontend die erlaubten Methoden zurück. Fehlende Fehlerantworten sind in der API-Beschreibung ergänzt."

[[entries]]
kind = "sicherheit"
text = "Die API und mitgelieferte Erweiterungen weisen unbekannte Felder und falsche JSON-Typen zurück. Pflichtköpfe, Antwortstatus und Dateitypen sind im API-Schema beschrieben. Unbekannte Methoden liefern auch mit ausgeliefertem Frontend 405 mit den erlaubten Methoden."

[[entries]]
kind = "dokumentation"
text = "Die Zählung der API-Vertragsrouten berücksichtigt die beiden Shield-Wochenberichtsrouten unter der bisherigen Shield-Adresse: 43 Shield-Routen und insgesamt 123 Vertragsrouten."

[[entries]]
kind = "verbessert"
text = "Die Update-Zentrale zeigt die Suche direkt oben und die Anleitung zum Aktualisieren von Hand erst beim Aufklappen."

[[entries]]
kind = "behoben"
text = "Der Schalter zum selbstständigen Einspielen von Sicherheitsupdates ist bis Version 1.0 ausgeblendet."

[[entries]]
kind = "verbessert"
text = "Beim Anlegen und Bearbeiten eines Servers lassen sich die üblichen Markierungen über Auswahlkästchen mit kurzen Erklärungen setzen; eigene Markierungen bleiben möglich."

[[entries]]
kind = "dokumentation"
text = "Die Anleitung zur ersten Einrichtung erklärt die Auswahlkästchen für Server und ihre Wirkung."

[[entries]]
kind = "verbessert"
text = "Beim Anlegen eines Stacks lassen sich fehlende Werte direkt eingeben; Passwörter werden verdeckt und nur für diesen Stack gespeichert."

[[entries]]
kind = "dokumentation"
text = "Die Anleitung für Vorlagen erklärt die Eingabe erforderlicher Werte und die getrennte Speicherung von Zugangsdaten."

[[entries]]
kind = "behoben"
text = "In der Docker-Netzliste steht bei „none“ jetzt „ohne Netz“, und gleiche Namen werden nicht mehr doppelt angezeigt."

[[entries]]
kind = "verbessert"
text = "Im Docker-Modul heißt der Knopf an einem Netz jetzt „Container verbinden“, und die Formulare zum Anlegen eines Netzes und zum Holen eines Images bleiben übersichtlich schmal."

[[entries]]
kind = "verbessert"
text = "Stack-Karten zeigen auch auf dem Handy nur noch die wichtigsten Knöpfe und ein Mehr-Menü."

[[entries]]
kind = "verbessert"
text = "Beim Stoppen eines Stacks lässt sich wählen, ob die Container bleiben oder entfernt werden, während die Volumes erhalten bleiben."

[[entries]]
kind = "verbessert"
text = "Images lassen sich jetzt im Update-Bereich eines Stacks holen."

[[entries]]
kind = "neu"
text = "Der Reiter Images zeigt die Gesamtgröße aller Images, räumt nach Rückfrage und Freigabe ungenutzte Images ohne Namen auf und meldet danach die Anzahl entfernter Images sowie den freigegebenen Speicherplatz."
bereich = "docker"

[[entries]]
kind = "behoben"
text = "Ausdrücklich eingeschaltete automatische Server-Updates können wieder Updates einspielen und die vorgesehenen Neustarts ausführen."

[[entries]]
kind = "behoben"
text = "Nach einer erfolgreichen Volume-Sicherung werden gestoppte Docker-Dienste auch dann wieder gestartet, wenn das anschließende Update mehrfach abgebrochen wird."

[[entries]]
kind = "behoben"
text = "Ohne Sicherungen zeigt die Übersicht jetzt einen grauen Hinweis statt eines grünen Erfolgs. Proxmox-Backups und das Backup-Widget zeigen bei leeren Listen „Keine Sicherungsjobs gefunden“."

[[entries]]
kind = "dokumentation"
text = "Unternehmen dürfen Deck und Dock bis zu 30 Tage intern zur Bewertung testen."

[[entries]]
kind = "dokumentation"
text = "Die technischen Anleitungen verwenden die heutigen Produktnamen und erklären, welche alten Namen für bestehende Installationen erhalten bleiben."

[[entries]]
kind = "verbessert"
text = "Mehrere Sicherheitsprüfungen (Besitzer von Dateien, Sperrdatei, Rechtewechsel beim Start) laufen jetzt auch in der automatischen Prüfung, statt dort still übersprungen zu werden."

[[entries]]
kind = "sicherheit"
text = "Die Prüfung von Compose-Dateien meldet jetzt alles als riskant, was nicht als harmlos bekannt ist: unbekannte Einstellungen, Ordner außerhalb der Datenordner, fremde Netze und Volumes."

[[entries]]
kind = "sicherheit"
text = "Beim Speichern im Editor und bei der Prüfung eines neuen Stacks werden Ordner in Compose-Dateien auf dem Server aufgelöst, damit ein Verweis auf einen Systemordner nicht als Datenordner durchgeht. Das gilt für den Moment der Prüfung und schützt nicht gegen einen Container, der in einem erlaubten Datenordner schreiben darf."

[[entries]]
kind = "sicherheit"
text = "Die Compose-Prüfung warnt auch bei volumes_from, device_cgroup_rules, vorhandenen (externen) Volumes sowie Volumes auf Geräten oder mit overlay."

[[entries]]
kind = "sicherheit"
text = "Beim Speichern einer Compose-Datei gilt eine Warnung nur noch als bekannt, wenn sich der ganze betroffene Dienst nicht geändert hat; jede Änderung an einem gewarnten Dienst oder an einem Dienst, der ein gewarntes Volume nutzt, braucht wieder die hohe Freigabe."

[[entries]]
kind = "sicherheit"
text = "In Nodvard Dock lässt sich ein Modul, das nicht zu Dock gehört, auch beim Start und beim automatischen Einschalten nicht mehr laden."

[[entries]]
kind = "sicherheit"
text = "Nodvard Dock richtet nie die volle sudo-Regel ein, auch dann nicht, wenn ein Modul root braucht und kein Hilfsskript hat."

[[entries]]
kind = "sicherheit"
text = "Ein gefundener Server wird nicht mehr mit einem von Hand angelegten Server zusammengeführt, wenn er einen SSH-Schlüssel mitbringt, den der von Hand angelegte noch nicht kennt."

[[entries]]
kind = "sicherheit"
text = "Die Konsole in einem Container öffnet sich nicht mehr, wenn sich nicht prüfen lässt, ob es der Container von Nodvard Deck selbst ist. Containern mit dem Image von Nodvard Deck bleibt sie ebenfalls verschlossen."

[[entries]]
kind = "sicherheit"
text = "Der Hilfsbefehl des Dateiwächters nimmt nur noch die beiden Dateien des eigenen Laufs an und prüft deren Ergebniszeilen, bevor er rechnet."

[[entries]]
kind = "sicherheit"
text = "Bei Sicherheitsupdates werden Paketnamen mit einem Minus am Ende abgelehnt, damit daraus keine Paket-Entfernung wird."

[[entries]]
kind = "sicherheit"
text = "Das Anmelden bei einer Registry zählt jetzt als hohes Risiko und braucht das Recht auf Tresor-Einträge, damit niemand ein Registry-Passwort ohne dieses Recht auf einen Server bringen kann."

[[entries]]
kind = "sicherheit"
text = "Die Rückfrage beim Anmelden bei einer Registry sagt, dass das Passwort danach in der Docker-Konfiguration des Servers liegt. Ein Vorschlag, der nicht als hohes Risiko gestellt wurde, wird nicht mehr ausgeführt."

[[entries]]
kind = "sicherheit"
text = "Auf der Seite „Aktionen“ zeigt „Änderung ansehen“ bei einer Compose-Änderung den Unterschied und die ganze neue Datei, bevor man freigibt. Das sehen nur Vorschlagende und Freigabeberechtigte."

[[entries]]
kind = "sicherheit"
text = "Der volle Inhalt und der Unterschied einer freizugebenden Compose-Änderung werden im Freigabe-Dialog angezeigt, nur für Vorschlagende und Freigabeberechtigte. Andere sehen den Inhalt nicht, auch nicht in der Aktionsliste."

[[entries]]
kind = "verbessert"
text = "Für die erste Einrichtung lässt sich ein eigener Code vorgeben; der gültige Code erscheint gut sichtbar in einer umrahmten Box im Container-Protokoll."

[[entries]]
kind = "sicherheit"
text = "Vorgegebene Einrichtungscodes brauchen mindestens acht Buchstaben oder Ziffern und werden nach dem ersten Konto mit einem Hinweis im Protokoll ignoriert."

[[entries]]
kind = "dokumentation"
text = "Die Anleitung zur ersten Einrichtung erklärt auf Deutsch und Englisch, wie sich ein eigener Einrichtungscode vorgeben und im Container-Protokoll finden lässt."

[[entries]]
kind = "verbessert"
text = "Netzwerk und das Entwicklerbeispiel Hello World werden nicht mehr standardmäßig mitgeliefert, Pi-hole und Nginx Proxy Manager bleiben verfügbar."

[[entries]]
kind = "sicherheit"
text = "Fail2ban-Einstellungen lassen sich nur mit persönlicher Berechtigung zum Ausführen von Serveraktionen ändern, auch bei voller Automatik."

[[entries]]
kind = "behoben"
text = "Nodvard Shield zeigt laufende Fail2ban-Werte statt abweichender gespeicherter Einstellungen. Überschreiben vorrangige Jail-Konfigurationen die freigegebenen Zahlenwerte, IP-Ausnahmen oder die Jail-Auswahl, wird die Änderung vor dem Reload zurückgesetzt."

[[entries]]
kind = "behoben"
text = "Ein fehlgeschlagenes Neuladen von Fail2ban nach der Installation wird als Fehler gemeldet."

[[entries]]
kind = "behoben"
text = "Wiederholte Löschversuche für Nutzungsdaten merken keine unbenutzten Kennungen mehr vor."

[[entries]]
kind = "behoben"
text = "Nutzungsberichte erkennen umbenannte Module richtig und lassen verwaiste Einträge aus."

[[entries]]
kind = "behoben"
text = "Löschwünsche für Nutzungsdaten gehen auch nach einem Empfängerwechsel an die bisherigen Empfänger."

[[entries]]
kind = "sicherheit"
text = "Die Compose-Vorgaben betreiben den Container ohne root, mit schreibgeschütztem Root-Dateisystem und ohne zusätzliche Rechte. Ohne Benutzervorgabe startet das Image als root und wechselt vor Migration und Anwendung zu UID 1000. Die Anwendung setzt HSTS nur bei erkanntem HTTPS; die Notseite sendet es immer, Browser beachten es nur über HTTPS. Öffentliche Bilder und der Health-Endpunkt bleiben auf fremden Webseiten abrufbar, damit Startseiten wie Homarr Deck anpingen können; alle anderen API-Antworten sind auf die eigene Seite beschränkt."

[[entries]]
kind = "behoben"
text = "Die gehärteten Compose-Vorlagen unterstützen weiterhin einen eigenen Einrichtungscode. Die Installationsanleitungen enthalten die Datenmigration und die Zugriffsbeschränkung. Bei fehlenden Schreibrechten nennt der Reparaturhinweis den Dienstnamen der jeweiligen Ausgabe."

[[entries]]
kind = "behoben"
text = "Unvollständige Teilabrufe von Dateien werden als Fehler erkannt, statt als erfolgreiche Übertragung zu enden."

[[entries]]
kind = "behoben"
text = "Teilabrufe von Dateien enden auch dann sauber, wenn die Quelle nach der Größenabfrage weniger Daten liefert."

[[entries]]
kind = "behoben"
text = "Fehler bei der erneuten Rechteprüfung einer grafischen Konsole werden als Verbindungsfehler gemeldet."

[[entries]]
kind = "verbessert"
text = "Die Dateiansicht kennzeichnet Verknüpfungen mit „Link“ statt einem Symbol und zeigt Ordnernamen ohne Ordnersymbole."
prs = [695]

[[entries]]
kind = "behoben"
text = "Bei einem nicht erreichbaren Server zeigen Kern und Erweiterungen wieder dieselbe Meldung."
prs = [695]

[[entries]]
kind = "behoben"
text = "Die Dateikopie-Tests verwenden die auf den Zielserver begrenzte Freigabe des Dateimanagers. Direkte Zugriffe ohne passende Host-, Erweiterungs- oder Operationsfreigabe bleiben gesperrt."

[[entries]]
kind = "sicherheit"
text = "Dateien: Eine verspätete Ordnerliste der vorher gewählten Quelle ersetzt nicht mehr die Liste der neuen Quelle, sodass Umbenennen und Löschen immer die angezeigten Einträge treffen."

[[entries]]
kind = "behoben"
text = "Die Live-Verbindung der Oberfläche öffnet nach einem Neuaufbau keine doppelte Verbindung mehr und verbindet sich nach Unterbrechungen zuverlässig neu."

[[entries]]
kind = "behoben"
text = "Scheitert „Alle als gelesen“ in der Meldungsglocke, erscheint dort eine Fehlermeldung, statt dass nichts passiert."

[[entries]]
kind = "behoben"
text = "Das Image übernimmt beim Start ältere root-eigene Datenordner und gibt vor Migration und Anwendung die Rechte ab. Bei fest vorgegebenem Benutzer nennt eine Startmeldung die Befehle zur Umstellung; die Installationsanleitungen erklären beide Wege."

[[entries]]
kind = "behoben"
text = "Ungenutzte Datenbankstrukturen werden ohne Datenverlust bereinigt und Filter für Aktionen und Meldungen erhalten passende Indizes."

[[entries]]
kind = "sicherheit"
text = "SSH-Zugriffe ohne passenden Kontext werden blockiert. Lesekontexte und geplante Jobs prüfen Befehle jedoch nicht auf Änderungen und bilden keine Sicherheitsgrenze gegen absichtlich schreibende Erweiterungen. Web-Terminal und Dateimanager bleiben mit ihren Berechtigungen nutzbar. SFTP-Lesezugriffe erlauben auch über geöffnete Dateien keine Änderungen. Nach einer fehlgeschlagenen oder abgebrochenen Volume-Sicherung bleiben Aufräumen und Wiederstarten der Dienste auch beim Herunterfahren möglich."

[[entries]]
kind = "behoben"
text = "Virenscans, Hintergrundprüfungen und wiederaufgenommene Aufgaben erhalten passende Zugriffskontexte. Die Container-Wache liest Absturzursachen und Logs; Servermesswerte, Schutzstatus, Hardware-Scans und Vorprüfungen funktionieren wieder. Dateiänderungen lassen sich bestätigen und Lageberichte merken den Schutzstatus. Der NPM-Adress-Check liest den Docker-Katalog mit einer auf dessen Anbieter begrenzten Freigabe. Docker zeigt Sicherungen und Projektordner, prüft Image-Updates und führt Dienstneustarts auf anderen Servern über die Freigabe aus. Abgebrochene Virenscans schließen ihre Einträge ab und geben wartende Server frei."

[[entries]]
kind = "dokumentation"
text = "Für Erweiterungsautoren: SSH-Aufrufe brauchen jetzt zusätzlich zur Berechtigung einen Freigabekontext und werden sonst blockiert. Die deutsche und englische Schnittstellen-Dokumentation erklären die Umstellung, die Grenzen der Lesekontexte und die automatischen Schreibzugriffe von Shield und Docker."

[[entries]]
kind = "behoben"
text = "Nodvard Dock gibt nur die benötigten API-Routen frei. Neue Deck-Routen bleiben gesperrt, bis sie ausdrücklich für Dock freigegeben werden."

[[entries]]
kind = "behoben"
text = "Wird eine Container-Umwandlung beim Stoppen oder Starten mehrfach abgebrochen, behält der Rückweg seine Freigabe, bis der alte Container wiederhergestellt ist oder die Aufräumfrist abläuft."

[[entries]]
kind = "sicherheit"
text = "Beim Holen und Einspielen von Stacks aus Git ermittelt Deck die Umgebungsdateien in einem eigenen Prozess mit festen Grenzen für Speicher und Laufzeit. Umgebungsdateien bleiben auch bei Pfaden mit mehreren führenden Schrägstrichen geschützt."

[[entries]]
kind = "behoben"
text = "Nach dem Einspielen oder Neustarten eines Stacks aus Git prüft Deck kurz, ob die Dienste stabil laufen. Bei Problemen nennt der Verlauf die betroffenen Dienste und verweist auf den Knopf „Logs“. Container-Logs werden dabei nicht im Verlauf gespeichert."

[[entries]]
kind = "behoben"
text = "Dienste für einmalige Aufgaben dürfen ohne Fehler enden und werden mit Exit-Code 0 als erfolgreich abgeschlossen gemeldet."

[[entries]]
kind = "behoben"
text = "Die Prüfung von Stacks aus Git meldet bei längeren Abrufen und absichtlich auf null gesetzten Diensten keine falschen Fehler mehr."

[[entries]]
kind = "behoben"
text = "Der Dienstkatalog bleibt auch mit alten Docker-Kennungen beim Vergleich mit dem registrierten Anbieter kompatibel."

[[entries]]
kind = "behoben"
text = "Die Protokollansicht begrenzt erneute Verbindungen, behält die Ausgabe währenddessen und beendet abgeschlossene Zeitraumabrufe."

[[entries]]
kind = "behoben"
text = "Die Container-Seite berücksichtigt erreichbare Docker-Server ohne Container beim Verbindungshinweis."

[[entries]]
kind = "behoben"
text = "Beim Abbruch eines Portainer-Umzugs bleibt die Freigabe bis zum Ende des Aufräumens erhalten, damit neu angelegte Dateien und Ordner auch beim Herunterfahren entfernt werden können."

[[entries]]
kind = "behoben"
text = "Nach einem Deck-Neustart kann der automatische Docker-Rückweg auch nach einer vorübergehenden Projektsperre erneut starten."

[[entries]]
kind = "behoben"
text = "Fail2ban-Änderungen lassen sich auch bei langsamem SSH-Verbindungsaufbau wieder vorschlagen."

[[entries]]
kind = "behoben"
text = "Nach einer fehlgeschlagenen Container-Umwandlung bleibt die Freigabe für den Rückweg erhalten, damit der alte Container auch bei einem Abbruch wieder starten kann."

[[entries]]
kind = "behoben"
text = "Das Aufräumen nach einer fehlgeschlagenen Volume-Sicherung oder einem Portainer-Umzug hat eine feste Zeitgrenze und meldet nötige Nacharbeiten, wenn der Server nicht antwortet."

[[entries]]
kind = "behoben"
text = "Volume-Sicherungen prüfen den freien Platz auch dann, wenn der Heimatordner mit einem Schrägstrich endet. Der über SFTP gelesene Heimatpfad wird ebenfalls bereinigt."

[[entries]]
kind = "behoben"
text = "Alte Einmal-Container lösen beim Einspielen oder Neustarten von Stacks aus Git keine falsche Fehlermeldung mehr aus."

[[entries]]
kind = "behoben"
text = "Die Prüfung von Stacks aus Git erkennt nach einem Neustart fehlende Container und verwendet bei allen Abfragen den Ordner des Stacks."

[[entries]]
kind = "behoben"
text = "Die Vorprüfung neuer Docker-Stacks verwendet auch mit eingegebenen Variablen den vorgesehenen Stack-Ordner und meldet dafür kein falsches hohes Risiko."

[[entries]]
kind = "behoben"
text = "Beim Löschen eines Stack-Ordners bleiben auch automatisch geladene Umgebungsdateien anderer Stacks geschützt, wenn eine Verknüpfung dorthin zeigt."

[[entries]]
kind = "behoben"
text = "Neue Docker-Stacks behalten beim erneuten Anwenden ihre gespeicherten Variablen. Unberührte optionale Felder überschreiben keine Vorgaben mehr, etwa den Datenordner über PWD."

[[entries]]
kind = "behoben"
text = "Beim Bearbeiten neuer Docker-Stacks bleiben eingegebene Werte erhalten, wenn ein Variablenplatzhalter beim Tippen kurz unvollständig ist."

[[entries]]
kind = "behoben"
text = "Beim Löschen eines Stack-Ordners bleiben Konfigurationsdateien anderer Stacks auch dann geschützt, wenn deren Arbeitsordner fehlt."

[[entries]]
kind = "behoben"
text = "Stacks ohne angegebenen Arbeitsordner blockieren die Prüfung beim Löschen eines anderen Stack-Ordners nicht mehr."

[[entries]]
kind = "behoben"
text = "Beim Löschen eines Stack-Ordners erkennt Deck auch Verknüpfungen auf Arbeitsordner und Konfigurationsdateien anderer Stacks und schützt sie vor dem Löschen."

[[entries]]
kind = "behoben"
text = "Die Volume-Abfrage vor Stack-Sicherungen nutzt einen geprüften Befehlsbauer. Das geänderte Shield-Hilfsskript erhält eine neue Version, damit Server die Korrektur übernehmen."

[[entries]]
kind = "dokumentation"
text = "Die Anleitung erklärt Schritt für Schritt, wie du Server über Tailscale verbindest und Verbindungsprobleme behebst."

[[entries]]
kind = "dokumentation"
text = "Die Anleitungen erklären den HTTP-Zugriff im Heimnetz und hinter einem Reverse Proxy sowie die noch verwendeten Übergangsnamen und vermeiden veraltende Versionsangaben und doppelte Installationshinweise."

[[entries]]
kind = "verbessert"
text = "Der Einrichtungsbefehl für Server ist deutlich kürzer, weil die Hilfsskripte darin komprimiert mitkommen. Auf dem Server wird dafür gzip gebraucht, das auf gängigen Linux-Systemen schon da ist."

[[entries]]
kind = "behoben"
text = "Der Test für einen eigenen Einrichtungscode berücksichtigt den zusätzlichen Schritt für Nutzungsdaten im Einrichtungsassistenten."

[[entries]]
kind = "behoben"
text = "Dauerhafte Hintergrundaufgaben von Shield und dem Beispielmodul starten nach einem Absturz wieder neu, und das Entwickler-Kit beschreibt, wie Module das selbst nutzen."

[[entries]]
kind = "behoben"
text = "Werden die Einstellungen eines Moduls zweimal kurz nacheinander gespeichert, übernimmt das Modul auch die zweite Änderung."

[[entries]]
kind = "dokumentation"
text = "Das Entwickler-Kit beschreibt das Anmelden geplanter Aufgaben jetzt so, wie der Kern es erwartet: mit Abwarten des Aufrufs."

[[entries]]
kind = "behoben"
text = "Erweiterungen lassen sich unabhängig von der Ladereihenfolge starten."

[[entries]]
kind = "sicherheit"
text = "Verbindungen von Erweiterungen zu verwalteten Servern (etwa die Konsole) haben eine feste Obergrenze je Nachricht, damit ein fremder Server nicht den Speicher von Nodvard Deck füllen kann."

[[entries]]
kind = "behoben"
text = "Ein Server in Wartung bleibt in Wartung, auch wenn ein Modul ihn beim nächsten Abgleich wieder als erreichbar meldet."

[[entries]]
kind = "sicherheit"
text = "Verlangt eine Erweiterung, einen Befehl als anderer Benutzer auszuführen, wird das abgelehnt, statt den Befehl still mit dem hinterlegten Zugang auszuführen."

[[entries]]
kind = "sicherheit"
text = "Ändert eine Erweiterung nach dem Laden ihre eigene Liste erlaubter Rechte, erhält sie dadurch keine zusätzlichen Rechte oder Hinweise auf fremde Geheimnisse."
prs = [692]

[[entries]]
kind = "behoben"
text = "Die Fail2ban-Einstellungen lassen sich auch mit 256 zusätzlichen Ausnahmen wiederholt speichern."

[[entries]]
kind = "neu"
text = "Nodvard Shield: Fail2ban lässt sich jetzt je Server einstellen, mit Sperrdauer, Fundzeit, Versuchen, Ausnahmen und auswählbaren Schutzregeln. Der SSH-Zugang von Deck bleibt automatisch ausgenommen, sshd bleibt Pflicht. Änderungen brauchen die gewohnte Freigabe und werden vor dem Aktivieren geprüft. Dafür bestehende Server nach dem Update erneut einrichten, damit das neue Shield-Hilfsskript bereitsteht."

[[entries]]
kind = "neu"
text = "Shield erstellt wöchentliche Sicherheitsberichte mit zwölf Wochen Verlauf und verschickt eine Kurzfassung mit Link über die vorhandenen Meldungskanäle."

[[entries]]
kind = "dokumentation"
text = "Die deutsche und englische Anleitung erklärt den Wochenbericht, seinen Zeitplan und die Grenzen der gespeicherten Ergebnisse."

[[entries]]
kind = "behoben"
text = "Fehlerkennungen lassen sich auch bei fehlgeschlagenen Befehlen der richtigen Aufrufstelle zuordnen, ohne vertrauliche Fehlertexte zu protokollieren."

[[entries]]
kind = "dokumentation"
text = "Die Auslieferungsanleitung nennt den tatsächlichen Benutzer des Healthchecks. Die deutsche und englische Erst-Einrichtung erklären die Ausnahme für das Einbinden öffentlicher Bilder."

[[entries]]
kind = "behoben"
text = "Beim Seitenwechsel beginnt der Inhalt wieder oben, damit Überschriften und Formulare vollständig sichtbar sind, während Reiterwechsel die bisherige Position behalten."

[[entries]]
kind = "sicherheit"
text = "Die Inhaltsrichtlinie der Oberfläche bleibt auch bei einer alten Ausnahmeeinstellung streng."

[[entries]]
kind = "behoben"
text = "Das Web-Terminal zeigt beliebige Text- und Hintergrundfarben auch mit strenger Inhaltsrichtlinie richtig an."

[[entries]]
kind = "sicherheit"
text = "Docker-Protokolle verbieten jetzt die Zwischenspeicherung im Browser und in vorgeschalteten Proxys, da sie vertrauliche Daten enthalten können."

[[entries]]
kind = "behoben"
text = "Nach einem Neustart von Docker verbindet sich die Protokollansicht automatisch erneut."

[[entries]]
kind = "behoben"
text = "Wenn eine Docker-Verbindung fehlschlägt, zeigt die Container-Seite einen Prüfhinweis und bietet einen erneuten Verbindungsversuch an."

[[entries]]
kind = "sicherheit"
text = "Das Signierwerkzeug für Updates bricht bei Weiterleitungen ab, damit die Zugangsdaten für die Image-Abfrage nicht an andere Ziele gelangen."

[[entries]]
kind = "sicherheit"
text = "Deck und die Notseite verlangen beim Einbinden fremder Inhalte jetzt eine ausdrückliche Freigabe des fremden Servers."

[[entries]]
kind = "sicherheit"
text = "Quellen für Stacks aus Git lassen sich nur noch mit dem Recht zum Verwalten von Erweiterungen festlegen oder ändern, damit gespeicherte Zugänge nicht für andere Repositorys verwendet werden können. Operatoren können die festgelegten Quellen weiterhin abrufen."

[[entries]]
kind = "behoben"
text = "Bei Stacks aus Git sind die Angaben zur Quelle ohne Verwaltungsrecht gesperrt. Ein Hinweis erklärt, dass nur Administratoren die Quelle ändern dürfen."

[[entries]]
kind = "sicherheit"
text = "Beim Einspielen eines Stacks aus Git bleiben vorhandene Umgebungsdateien der Dienste erhalten. Bei fehlerhaften Compose-Dateien, variablen Pfaden oder eingebundenen Compose-Dateien lehnt Deck das Einspielen vor dem Schreiben ab, weil sich die betroffenen Umgebungsdateien nicht sicher bestimmen lassen."

[[entries]]
kind = "behoben"
text = "Die Prüfung von Stacks aus Git auf Knopfdruck wartet nicht mehr auf einen laufenden Zeitplan. Ihr Ergebnis bleibt auch nach dessen Abschluss sichtbar."

[[entries]]
kind = "behoben"
text = "Server-Zustand zeigt fehlende SSH-Zugänge als eigenen Zustand und meldet Server erst nach erfolgreicher Prüfung als erreichbar. Live-Abfragen halten nach einem Fehler an und lassen sich erneut versuchen."

[[entries]]
kind = "behoben"
text = "Allgemeine Abfragefehler beim Server-Zustand werden nicht mehr als fehlgeschlagene SSH-Verbindung angezeigt. Hinweise auf die Zugangseinstellungen erscheinen nur bei Zugangs- und SSH-Fehlern."

[[entries]]
kind = "verbessert"
text = "Beim Anlegen eines Servers steht der Anzeigename zuerst, und der Kurzname ergibt sich daraus von selbst („Müllers NAS“ wird „muellers-nas“); wer will, ändert ihn vor dem Anlegen."

[[entries]]
kind = "behoben"
text = "Aufräumen und Wiederstarten nach einem Aktionsabbruch behalten ihre Freigabe auch bei weiteren Abbrüchen bis zum Ende. Beim Herunterfahren wartet Deck innerhalb der Wartefrist auch auf diese Aufgaben."

[[entries]]
kind = "behoben"
text = "Ungültige Größenangaben mit Unicode-Ziffern beim App-Symbol liefern eine Nicht-gefunden-Antwort statt eines Serverfehlers."

[[entries]]
kind = "behoben"
text = "Teilabrufe von Dateien liefern die angeforderten Bytes, auch bei begrenzten Bereichen und beim Abruf des Dateiendes."

[[entries]]
kind = "sicherheit"
text = "Grafische Konsolen übertragen Daten erst nach erneuter Rechteprüfung und werden bei entzogenem Zugriff oder fehlgeschlagener Prüfung geschlossen."

[[entries]]
kind = "behoben"
text = "Live-Verbindungen weisen Nachrichten mit falschem JSON-Typ geordnet zurück, auch vor der Anmeldung."

[[entries]]
kind = "behoben"
text = "Gespeicherte Git-Quellen für Stacks belegen zusammen höchstens 500 MB. Reicht der Platz für einen neuen Stand nicht, bleibt der bisherige erhalten."
prs = [688]

[[entries]]
kind = "behoben"
text = "Ein neuer Git-Stand lässt sich auch holen, während eine andere Git-Quelle entfernt wird."
prs = [688]

[[entries]]
kind = "verbessert"
text = "Git-Abfragen für Stacks laufen nacheinander. Antwortet ein Git-Server langsam, warten auch Abfragen für andere Stacks und Server."
prs = [688]

