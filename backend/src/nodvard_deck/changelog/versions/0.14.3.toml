version = "0.14.3"
date = "2026-11-21"
title = "Sicherheit und Korrekturen"

[[entries]]
kind = "sicherheit"
text = "Im Protokoll sehen Konten ohne das Recht, Befehle auf Servern auszuführen, keine Fehlermeldungen und andere Texte von den Servern mehr, weder in der Begründung noch in den Einzelheiten. Kennungen, Namen und Zahlen bleiben sichtbar."

[[entries]]
kind = "sicherheit"
bereich = "backups"
text = "Beim erneuten Ausführen eines Proxmox-Backup-Jobs werden nur noch Gäste gesichert, die zu diesem Job gehören. Gehört der Gast bei der Freigabe nicht mehr zum Job, startet kein Backup und Deck bittet um einen neuen Vorschlag."

[[entries]]
kind = "behoben"
bereich = "backups"
text = "Proxmox-Backups: Hat eine Verbindung einen Namen mit zwei Bindestrichen hintereinander, trafen Einstellungen und Verlauf eines Jobs über einen alten Link manchmal einen fremden Job. Die Kennung wird jetzt eindeutig zugeordnet; ist das nicht möglich, bittet die Seite darum, neu zu laden."

[[entries]]
kind = "behoben"
text = "Wenn Docker-Ordner im Dateimanager nicht gelesen werden können, steht der Grund jetzt im Protokoll."

[[entries]]
kind = "sicherheit"
text = "Ein Download-Link für eine Sicherung gilt nur noch, solange du an diesem Gerät angemeldet bist und dein Passwort gleich bleibt. Nach dem Abmelden oder einem neuen Passwort holst du den Link einfach neu."

[[entries]]
kind = "behoben"
bereich = "dienste"
text = "Uptime Kuma, Push-Nachrichten (ntfy) und die Nextcloud-Dateien zeigen bei „nicht erreichbar“ kurze deutsche Sätze (keine Antwort, Verbindung abgelehnt, Name nicht auffindbar, Zertifikat, Verschlüsselung) statt englischer Fehlertexte."

[[entries]]
kind = "sicherheit"
text = "Wer andere Konten nicht verwalten darf, sieht deren Namen und Rollen nicht mehr im Protokoll und bekommt keine Meldungen mehr zu fremden Konten. Ereignisse und Warnungen zum eigenen Konto bleiben sichtbar, ohne den Namen dessen, der den Zugang geändert hat."

[[entries]]
kind = "behoben"
bereich = "npm"
text = "Nginx Proxy Manager: Läuft er unter einem Pfad, bleibt der Pfad erhalten, auch bei doppelten Schrägstrichen in der Adresse. Meldet er beim Start noch 502, 503 oder 504, steht dort jetzt „startet gerade noch“ statt eines Anmeldefehlers, und bei 405 kommt der Hinweis, die Adresse zu prüfen."

[[entries]]
kind = "sicherheit"
text = "Taucht eine schon erneuerte Anmeldung später noch einmal auf, beendet Deck diese Anmeldung samt allen Erneuerungen und vermerkt das im Protokoll. Eine kopierte Anmeldung endet so spätestens, wenn das eigene Gerät sich wieder meldet, auch nach einem Passwortwechsel."

[[entries]]
kind = "sicherheit"
bereich = "shield"
text = "Nodvard Shield kürzt und säubert den Servernamen aus einer abgelehnten KI-Antwort, bevor er im Protokoll steht."

[[entries]]
kind = "sicherheit"
bereich = "shield"
text = "Nodvard Shield: Updates, Neustart, Installieren, Viren-Wächter, Dateien in die Quarantäne verschieben, wiederherstellen und löschen sowie Fail2ban-Sperren kann nur noch auslösen, wer auch Befehle auf Servern ausführen darf. Das gilt auch bei voller Automatik."

[[entries]]
kind = "sicherheit"
bereich = "shield"
text = "Nodvard Shield: Startet jemand ohne dieses Recht einen Virenscan, verschiebt Shield die Funde nicht selbst in die Quarantäne. Sie bleiben offen und tragen einen Hinweis. Geplante Scans verschieben weiter wie eingestellt."

[[entries]]
kind = "sicherheit"
text = "Eine laufende automatische Sicherung kann nur noch der Owner abbrechen. Jedes Abbrechen eines Laufs und jeder abgelehnte Versuch steht jetzt im Protokoll."

[[entries]]
kind = "sicherheit"
bereich = "proxmox"
text = "Hinterlegte Zugangsdaten von Proxmox VE und Proxmox-Backups lassen sich über die Verbindungen nicht mehr ohne Passwort löschen oder auf eine andere Adresse umstellen."

[[entries]]
kind = "sicherheit"
text = "Wer bei einem Modul mit hinterlegten Zugangsdaten die Zertifikatsprüfung abschaltet, einen anderen Fingerabdruck einträgt oder den gemerkten entfernt, bestätigt das jetzt mit dem Passwort."

[[entries]]
kind = "behoben"
bereich = "proxmox"
text = "Verbindungen von Proxmox VE oder Proxmox-Backups, deren Name mit einem Leerzeichen beginnt oder endet, lassen sich wieder entfernen, und ihr neues Zertifikat lässt sich bestätigen; eine gleichzeitig in einem anderen Tab angelegte Verbindung bleibt dabei samt Zugangsdaten erhalten. Neue Verbindungen mit so einem Namen nimmt Deck nicht mehr an und sagt, warum."

[[entries]]
kind = "sicherheit"
text = "Beim Hochladen auf einen Server folgt der Dateimanager Verknüpfungen und nutzt Ordner im Zielpfad nur noch, wenn sie root oder dem Konto gehören, mit dem Deck auf dem Server angemeldet ist, und kein anderes Konto sie austauschen kann. Als root angemeldet geht ein Upload in den Ordner eines anderen Benutzers deshalb nicht mehr. Die Meldung erklärt, wie es weitergeht: mit dem Konto des Besitzers verbinden oder in einen Ordner von root hochladen und dort verschieben. Auf Windows-Servern prüft Deck dabei nur die gemeldeten Schreibrechte, nicht den Besitzer der Ordner."

[[entries]]
kind = "sicherheit"
text = "Live-Aktualisierungen der Module, etwa von Nodvard Shield, bekommt nur noch, wer die zugehörige Kachel sehen darf. Kontomeldungen zu anderen Konten erscheinen live nur bei Leuten, die andere Konten sehen dürfen, und Ereignisse ohne feste Zuordnung werden gar nicht mehr live verteilt. Wer andere Konten nicht sehen darf, liest auch live in Meldungen zum eigenen Konto nicht den Namen des Kontos, das die Änderung gemacht hat."

[[entries]]
kind = "sicherheit"
text = "Live-Meldungen kommen sofort an, auch wenn ein anderer Browser gerade nicht mitliest. Ein Konto kann höchstens 20 Live-Verbindungen gleichzeitig offen halten."

[[entries]]
kind = "sicherheit"
text = "Werden einem Konto Rechte entzogen, bekommt es auch Live-Meldungen, die gerade unterwegs sind, nur noch in der Fassung, die zu den neuen Rechten passt."

[[entries]]
kind = "behoben"
text = "Sind zu viele Tabs offen, versucht die Oberfläche nicht mehr ständig neu zu verbinden, sondern zeigt einen Hinweis mit „Erneut verbinden“."

[[entries]]
kind = "sicherheit"
text = "Wird ein Passwort geändert oder zurückgesetzt, lässt sich eine gerade begonnene Anmeldung mit dem alten Passwort nicht mehr mit dem Zwei-Faktor-Code abschließen. Man meldet sich dann einfach mit dem neuen Passwort an."

[[entries]]
kind = "behoben"
text = "Docker: Image-Updates laufen immer im Projektordner des Stacks. Damit werden ${PWD} und relative Pfade auch ohne gespeicherte Variablen richtig ausgewertet."

[[entries]]
kind = "behoben"
text = "Docker schützt den eigenen Container auch bei einem eigenen Hostnamen, erkennt Portainer-Ordner genauer und behält Prüfergebnisse bei kurzen Lesefehlern. Abgestürzte Stack-Container werden als Problem gezählt, während der Dateimanager bei einem nicht erreichbaren Docker-Dienst leer bleibt."

[[entries]]
kind = "behoben"
bereich = "backups"
text = "Backup-Prüfungen berücksichtigen NVMe-Platten und Verbindungsnamen mit doppeltem Bindestrich richtig."

[[entries]]
kind = "behoben"
bereich = "gameserver"
text = "Valheim verwendet den Standard-Weltnamen, behält Servernamen mit Bindestrichen und zeigt bei gestopptem Dienst keine alten Spielerzahlen mehr."

[[entries]]
kind = "behoben"
text = "Fehlerhafte Meldungsarten einer Erweiterung blockieren die Einstellungen nicht mehr."

[[entries]]
kind = "behoben"
bereich = "backups"
text = "Backup-Jobs mit doppeltem Bindestrich in Verbindung oder Job-Name werden nie mit einem anderen Job verwechselt."

[[entries]]
kind = "behoben"
text = "Beim Speichern von Moduleinstellungen bleiben gleichzeitige Änderungen an verborgenen Werten des Moduls erhalten."

[[entries]]
kind = "behoben"
bereich = "proxmox"
text = "Nicht erreichbare Proxmox-Speicher werden in Kachel und Liste klar angezeigt und vom Wächter einmal mit Entwarnung gemeldet."

[[entries]]
kind = "behoben"
bereich = "shield"
text = "Shield zeigt neue Funde auch dann beim richtigen Server an, wenn dieser während des Scans zusammengeführt wurde."

[[entries]]
kind = "behoben"
bereich = "shield"
text = "Shield: Liegen viele offene Funde in einem Ordner, zeigt der Reiter Quarantäne einen Hinweis und bietet an, den Ordner von den Scans auszunehmen und die Funde darin zu schließen. Systemordner wie /tmp, /etc oder /home und Ordner, die nicht root gehören oder in die andere Konten schreiben dürfen, lassen sich so nicht ausnehmen. Dass die Ausnahme für alle Server gilt, muss ausdrücklich bestätigt werden."

[[entries]]
kind = "behoben"
bereich = "shield"
text = "Shield: Ein durch „Ordner ausnehmen“ geschlossener Fund bietet an, alle Funde dieses Ordners auf dem Server wieder zu beachten, auch bei mehr als 200 Funden. Die Ausnahme selbst bleibt, bis du sie unter Einstellungen löschst."

[[entries]]
kind = "sicherheit"
text = "Module können über andere Module keine Aktionen, Befehle, Terminals oder Konsolen mehr direkt starten und dabei Freigaben und Protokollierung umgehen."

[[entries]]
kind = "behoben"
bereich = "shield"
text = "Shield: Wird ein langer Virenscan vor dem Ende abgebrochen, zum Beispiel am Zeitlimit von 4 Stunden beim Tiefenscan, sagen der Hinweis am Scan und die Notiz an den Funden jetzt, dass der Scan abgebrochen wurde. Bisher stand dort fälschlich etwas von einem Zeilenumbruch im Dateinamen."
