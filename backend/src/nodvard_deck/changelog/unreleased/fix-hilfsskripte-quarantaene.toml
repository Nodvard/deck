[[entries]]
kind = "sicherheit"
text = "Das Hilfsskript von Nodvard Shield verschiebt nur noch Dateien in die Quarantäne, in denen ClamAV selbst einen Fund meldet, und legt sie nur an ihren ursprünglichen Ort zurück."

[[entries]]
kind = "sicherheit"
text = "Geprüft wird die Datei in einem Ordner, an den nur root kommt; so lässt sie sich während der Prüfung nicht mehr austauschen. Ordner der Quarantäne, die nicht root allein gehören, nimmt Shield nicht mehr an."

[[entries]]
kind = "sicherheit"
text = "Nodvard Shield und Server-Zustand rufen ein Hilfsskript nur noch auf, wenn es genau das mitgelieferte ist. Ein verändertes Skript zeigt „Verbindung prüfen“ als Fehler, ein veraltetes als Warnung, und statt „Keine root-Rechte“ steht dann da, dass der Server neu eingerichtet werden muss."
