[[entries]]
kind = "neu"
text = "Drei Themes zur Wahl: Klassisch hell, Schlicht dunkel (Standard) und Profi dunkel. Jeder Nutzer wählt sein Theme unter Einstellungen → Darstellung, es gilt auf jedem Gerät."

[[entries]]
kind = "verbessert"
text = "Ruhigere Oberfläche: keine Farbverläufe, kein Leuchten und kein Gitter im Hintergrund mehr. Das Branding legt nur noch Name, Logo und auf Wunsch eine eigene Akzentfarbe fest."
