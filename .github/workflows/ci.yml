# CI-Pipeline: baut und testet bei jeder Aenderung automatisch ALLE Extension-Frontend-
# Bundles, statt sich auf einen manuellen `node build.mjs`-Lauf pro Extension zu
# verlassen. Lokal deckt dasselbe der `.githooks/pre-commit`-Hook ab (siehe dort) --
# dieser Workflow ist die serverseitige Gegenprobe.
name: CI

# Sparsam mit den Actions-Minuten: Push nur auf
# main, Feature-Branches laufen einmal ueber ihren PR statt doppelt. Reine
# Doku-Aenderungen starten keinen Lauf, und ein neuer Push bricht den alten ab.
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  pull_request:
    paths-ignore: ["**/*.md", "docs/**"]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Kein Job schreibt etwas bei GitHub (nur auschecken, bauen, testen): Das GITHUB_TOKEN darf darum nur lesen.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Wie das Docker-Image: ohne tesseract scheitern die OCR-Tests der
      # documents-Extension, ohne constraints testet CI andere Versionen als der Build.
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y tesseract-ocr tesseract-ocr-deu
      - run: pip install -c deploy/constraints.txt -e sdk/python -e "backend[dev]"
      - run: pytest sdk/python/tests backend/tests
      # Die Tests von deploy/backup.sh und deploy/restore.sh mit echten Besitzern und Rechten (Marker needs_root) brauchen
      # root und werden oben nur uebersprungen: hier noch einmal als root. Die Skripte laufen dabei aus einer Kopie im
      # Temp-Ordner. Kein Cache und kein Bytecode, damit nichts root-Eigenes im Checkout liegen bleibt.
      - run: sudo -E env "PATH=$PATH" PYTHONDONTWRITEBYTECODE=1 python -m pytest -q -p no:cacheprovider -m needs_root backend/tests/test_deploy_switch.py
      # Update-Helfer (deploy/updater): nur Standardbibliothek, ohne Installation und ohne Backend-conftest -- eigener Aufruf.
      - run: python -m pytest deploy/updater/tests
      # Dieselben Tests noch einmal als root (der Runner hat sudo ohne Passwort): nur dann koennen Dateien einem anderen
      # Besitzer gehoeren (Betriebsbild: Helfer uid 0, Dashboard uid 1000). Ohne das laufen genau diese Tests (Marker
      # needs_root) in der CI nie. Kein Cache und kein Bytecode, damit nichts root-Eigenes im Checkout liegen bleibt.
      - run: sudo -E env "PATH=$PATH" PYTHONDONTWRITEBYTECODE=1 python -m pytest -q -p no:cacheprovider -m needs_root deploy/updater/tests
      - run: python scripts/check_core_purity.py

  # Image des Update-Helfers (deploy/updater/Dockerfile) bauen und so starten wie im Betrieb: ohne Netz, nur lesbar,
  # ohne Rechte, mit der Speicher- und Prozessgrenze aus deploy/compose.standalone-mit-helfer.yml. Der Selbsttest
  # prueft, ob das Paket im Image vollstaendig und lauffaehig ist. Dazu eine Obergrenze fuer die Groesse: Das Image soll
  # klein bleiben (nur Python und das Paket), auch wenn spaeter etwas dazukommt.
  updater:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image bauen
        run: docker build -f deploy/updater/Dockerfile -t nodvard-deck-updater:ci .
      - name: Selbsttest wie im Betrieb
        run: docker run --rm --network none --read-only --cap-drop ALL --security-opt no-new-privileges --memory 64m --pids-limit 32 nodvard-deck-updater:ci --selftest
      # Gemessen wird die Groesse aller Dateien im Image (entpackt), im Container mit du. `docker image inspect` meldet
      # je nach Image-Speicher der Engine mal die entpackte, mal die gepackte Groesse (containerd) und taugt darum nicht
      # als Grenze. DAC_READ_SEARCH, damit du auch Ordner anderer Benutzer lesen darf (sonst meldet du dort einen
      # Fehler, und der Schritt schlaegt fehl).
      - name: Groesse unter 160 MB
        run: |
          out="$(docker run --rm --network none --read-only --cap-drop ALL --cap-add DAC_READ_SEARCH --entrypoint du nodvard-deck-updater:ci -sxb /)"
          size="${out%%[[:space:]]*}"
          case "$size" in
            ''|*[!0-9]*) echo "Groesse des Images nicht messbar: $out" >&2; exit 1 ;;
          esac
          echo "Image des Update-Helfers: $size Byte (alle Dateien, entpackt)"
          if [ "$size" -ge 160000000 ]; then
            echo "Das Image des Update-Helfers ist groesser als 160 MB." >&2
            exit 1
          fi

  # Nodvard Dock: dasselbe Dockerfile, nur mit dem Modul docker. Unter dem Namen aus deploy/nodvard-dock/compose.yml
  # gebaut, damit die Compose-Datei genau dieses Image startet und nichts zieht.
  dock-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image bauen
        run: docker build -f deploy/Dockerfile --build-arg NODVARD_DECK_EXTENSIONS=docker -t ghcr.io/nodvard/dock:latest .
      - name: Nur das Modul docker im Image
        run: |
          found="$(docker run --rm --entrypoint sh ghcr.io/nodvard/dock:latest -c 'cd /app/extensions && ls -d */ | tr -d / | tr "\n" " "')"
          if [ "$found" != "_shared docker " ]; then
            echo "Im Image liegen andere Module: $found" >&2
            exit 1
          fi
          if docker run --rm --entrypoint sh ghcr.io/nodvard/dock:latest -c 'command -v tesseract'; then
            echo "Tesseract gehört nur zum Modul documents." >&2
            exit 1
          fi
      - name: Start mit der Compose-Datei
        working-directory: deploy/nodvard-dock
        run: |
          docker compose up -d
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/api/v1/health 2>/dev/null | grep -q '"status":"ok"' && break
            if [ "$i" = 60 ]; then
              docker compose logs
              echo "Nodvard Dock meldet nach 5 Minuten nicht ok." >&2
              exit 1
            fi
            sleep 5
          done
      # Eine frische Installation startet ohne eingeschaltetes Modul; erst das Einschalten zeigt, ob docker im Image lädt.
      - name: Einrichten und Docker einschalten
        working-directory: deploy/nodvard-dock
        run: |
          api=http://127.0.0.1:8080/api/v1
          code="$(docker compose logs --no-color nodvard-dock | grep -o 'Einrichtungscode: [A-Z0-9-]*' | tail -n 1 | cut -d' ' -f2)"
          password="$(openssl rand -hex 16)"
          curl -fsS -H 'Content-Type: application/json' -d "{\"username\":\"ci-owner\",\"password\":\"$password\",\"setup_code\":\"$code\"}" "$api/auth/bootstrap" >/dev/null
          token="$(curl -fsS -H 'Content-Type: application/json' -d "{\"username\":\"ci-owner\",\"password\":\"$password\"}" "$api/auth/login" | python3 -c 'import json, sys; print(json.load(sys.stdin)["access_token"])')"
          known="$(curl -fsS -H "Authorization: Bearer $token" "$api/extensions" | python3 -c 'import json, sys; print(" ".join(sorted(e["id"] for e in json.load(sys.stdin))))')"
          if [ "$known" != "docker" ]; then
            echo "Erwartet war nur das Modul docker, gefunden: $known" >&2
            exit 1
          fi
          curl -fsS -X POST -H "Authorization: Bearer $token" "$api/extensions/docker/enable" >/dev/null
          for i in $(seq 1 10); do
            loaded="$(docker compose logs --no-color nodvard-dock | grep -o 'Erweiterungen geladen: .*' | tail -n 1)"
            [ "$loaded" = "Erweiterungen geladen: docker" ] && break
            sleep 1
          done
          if [ "$loaded" != "Erweiterungen geladen: docker" ]; then
            echo "Erwartet war nur das Modul docker, geladen ist: ${loaded:-nichts}" >&2
            exit 1
          fi
          # Bundle und eine Route des Moduls: ohne Server leer, aber erreichbar.
          curl -fsS -o /dev/null -H "Authorization: Bearer $token" "$api/extensions/docker/frontend/index.js"
          curl -fsS -H "Authorization: Bearer $token" "$api/ext/docker/widgets/matrix" | python3 -c 'import json, sys; json.load(sys.stdin)["data"]'
          if docker compose logs --no-color nodvard-dock | grep -q Traceback; then
            exit 1
          fi
      # Gemessen wie beim Update-Helfer: alle Dateien entpackt, mit du im Container. Der Speicher nach dem Start steht
      # nur in der Zusammenfassung; er schwankt mit dem Runner und taugt nicht als Grenze.
      - name: Größe unter 350 MB, Speicher nach dem Start
        run: |
          out="$(docker run --rm --network none --cap-drop ALL --cap-add DAC_READ_SEARCH --entrypoint du ghcr.io/nodvard/dock:latest -sxb /)"
          size="${out%%[[:space:]]*}"
          case "$size" in
            ''|*[!0-9]*) echo "Größe des Images nicht messbar: $out" >&2; exit 1 ;;
          esac
          memory="$(docker stats --no-stream --format '{{.MemUsage}}' "$(docker compose -f deploy/nodvard-dock/compose.yml ps -q nodvard-dock)")"
          echo "Nodvard Dock: $((size / 1000000)) MB (alle Dateien, entpackt), Speicher nach dem Start: $memory" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$size" -ge 350000000 ]; then
            echo "Das Image von Nodvard Dock ist größer als 350 MB." >&2
            exit 1
          fi
      - name: Protokoll bei einem Fehler
        if: failure()
        working-directory: deploy/nodvard-dock
        run: docker compose logs --no-color

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Wie das Docker-Image (node:22-slim) -- jsdom verlangt ^22.22.2, unter
          # Node 20 bricht `npm test` mit "webidl.util.markAsUncloneable is not a function".
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run typecheck:extensions
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run test:extensions
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      # Baut jede Extension in ein Schattenverzeichnis und vergleicht gegen das
      # committete `dist/index.js` -- schlaegt fehl, wenn eine Extension geaendert,
      # aber nicht neu gebaut+committet wurde. Aendert das Arbeitsverzeichnis nicht
      # (siehe Skript-Docstring).
      - run: node scripts/build_extension_frontends.mjs --check
