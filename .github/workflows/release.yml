# Veroeffentlicht das Docker-Image, sobald ein Versions-Tag (v0.6.0, v1.0.0 ...) gepusht wird:
#
#   git tag v0.6.0 && git push origin v0.6.0
#
# Reihenfolge fuer eine fertige Version (v0.6.0): zuerst `python scripts/release.py <version>` (hebt version.py
# an) mergen, dann taggen. Eine Vorabversion (v0.6.0-rc1, v0.6.0-rc2 ...) wird dagegen vorher getaggen, ohne
# release.py: Ihre Zahl vor dem "-" darf groesser sein als version.py (der rc einer kommenden Version) oder
# gleich, nie kleiner. Aenderungen zwischen rc1 und der fertigen Version landen so ganz normal in unreleased/ und
# damit in der fertigen Version. Passt das Tag nicht, bricht der Lauf vor dem Bauen ab (Schritt "Tag passt zu
# version.py").
#
# Das Image entsteht für linux/amd64 (normale PCs/NAS) und linux/arm64 (Raspberry Pi) und
# landet in der GitHub-Container-Registry. Nutzer ziehen es mit der Datei
# deploy/compose.standalone.yml, ohne das Repository zu kennen. Danach baut der Job `updater-image` das Image des
# Update-Helfers (deploy/updater/Dockerfile) für deploy/compose.standalone-mit-helfer.yml und der Job `dock-image`
# Nodvard Dock (nur das Modul docker) für deploy/nodvard-dock/compose.yml. Der Job `helper-release` legt zum Tag einen
# Entwurf des GitHub-Releases an oder ergänzt ein vorhandenes, mit der Compose-Datei mit Helfer, die den geprüften Helfer
# per Digest nennt. Veröffentlicht wird das Release immer von Hand („Publish release“).
#
# Die Actions sind auf eine Commit-SHA festgelegt (Version als Kommentar), damit ein verschobenes Tag
# keinen fremden Code in den Lauf mit Schreibrecht auf die Registry bringt.
#
# Kein Deploy und keine eigenen Geheimnisse: angemeldet wird nur mit dem GITHUB_TOKEN, den
# GitHub fuer jeden Lauf selbst vergibt. Damit das Paket unter dem Namen IMAGE_NAME erscheint,
# muss die GitHub-Organisation "nodvard" existieren und das Repository dort liegen (oder
# IMAGE_NAME unten auf den echten Besitzer zeigen).
name: Release

on:
  push:
    # Nur echte Versionsnummern (v1.2.3, v1.2.3-rc1); ein Tag wie "vtest" startet nichts und ueberschreibt `latest` nie.
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

env:
  # Name des Images. An EINER Stelle aendern, wenn die Organisation anders heisst.
  IMAGE_NAME: ghcr.io/nodvard/deck
  # Nodvard Dock, in derselben Organisation wie IMAGE_NAME.
  DOCK_IMAGE_NAME: ghcr.io/nodvard/dock

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      newest: ${{ steps.newest.outputs.newest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      # Version fuer das Label ohne fuehrendes "v" (v0.6.0 -> 0.6.0). Ueber eine Umgebungs-
      # variable uebergeben, nicht in die Shell eingesetzt.
      - name: Version aus dem Tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "VERSION=${REF_NAME#v}" >> "$GITHUB_ENV"

      # Das Tag muss zur Version im Code passen, sonst meldete das fertige Image im Dashboard dauerhaft
      # "Update verfuegbar" auf sich selbst. Eine fertige Version (v0.6.0) muss genau __version__ sein. Bei einer
      # Vorabversion (v0.6.0-rc1) zaehlt der Teil vor dem "-": er darf groesser sein als __version__ (der rc kommt
      # vor `scripts/release.py`) oder gleich, nie kleiner; der ganze Wert muss eine Version sein, die auch die
      # Update-Suche versteht (kein "+build", kein "_"). Das Image kennt seine genaue Version aus der Datei
      # /app/image-info.json, die Update-Suche braucht also kein passendes __version__.
      # VERSION kommt als Umgebungsvariable (aus dem Schritt davor), nichts wird in den Befehl eingesetzt.
      - name: Tag passt zu version.py
        run: |
          code="$(python3 -c 'import runpy; print(runpy.run_path("backend/src/nodvard_deck/version.py")["__version__"])')"
          base="${VERSION%%-*}"
          if [ "$base" = "$VERSION" ]; then
            [ "$VERSION" = "$code" ] && ok=1 || ok=0
          else
            python3 -c 'import re, sys
          def key(v):
              m = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", v)
              return tuple(map(int, m.groups())) if m else None
          num = r"(0|[1-9][0-9]{0,8})"
          pre = num + r"\." + num + r"\." + num + r"-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*"
          full_ok = re.fullmatch(pre, sys.argv[3], re.ASCII) is not None
          base, code = key(sys.argv[1]), key(sys.argv[2])
          sys.exit(0 if full_ok and base and code and base >= code else 1)' "$base" "$code" "$VERSION" && ok=1 || ok=0
          fi
          if [ "$ok" != 1 ]; then
            echo "Tag v$VERSION passt nicht zu __version__ = $code in backend/src/nodvard_deck/version.py." >&2
            echo "Fertige Version: zuerst python scripts/release.py <version> mergen, dann taggen. Vorabversion: Zahl vor dem - mindestens $code." >&2
            exit 1
          fi
          echo "Tag v$VERSION passt zu version.py ($code)."

      # `latest` und die Tags ohne Nummer gehören der höchsten fertigen Version: Ein Patch für eine ältere Reihe (etwa
      # 0.12.2 nach 0.13.0, vom Zweig release/0.12) bekommt nur seine eigenen Tags. Ohne Liste bricht der Lauf ab. Ein
      # Schritt ohne `shell:` läuft ohne pipefail; die Zuweisung bricht unter `-e` ab, eine Pipe nicht.
      - name: Höchste fertige Version
        id: newest
        run: |
          tags="$(git ls-remote --tags --refs origin 'v*')"
          python3 scripts/release_newest.py "$VERSION" <<< "$tags" >> "$GITHUB_OUTPUT"

      # QEMU, damit der x86-Runner auch das arm64-Image bauen kann.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags und Labels festlegen
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5.10.0
        with:
          images: ${{ env.IMAGE_NAME }}
          # latest nie automatisch: nur für die höchste fertige Version, nie für Vorabversionen (v1.2.3-rc1).
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.newest.outputs.newest == 'true' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
            org.opencontainers.image.version=${{ env.VERSION }}

      - name: Bauen und veroeffentlichen
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Herkunft und Version fuer "Nach Updates suchen" im Dashboard: landen als Datei /app/image-info.json im
          # Image (deploy/Dockerfile, nodvard_deck.image_info), nicht als Umgebungsvariable.
          # APT_REFRESH holt die Debian-Pakete (Tesseract samt Abhängigkeiten) bei jedem Release frisch, mit den
          # Sicherheitsupdates seit dem letzten Bau, statt sie aus dem Cache zu nehmen.
          build-args: |
            VERSION=${{ env.VERSION }}
            IMAGE=${{ env.IMAGE_NAME }}
            APT_REFRESH=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Image des Update-Helfers (deploy/updater), Name: IMAGE_NAME mit "-updater". Erst nach dem Dashboard-Image (`needs`):
  # So gibt es keinen Helfer zu einem Tag, das der Schritt "Tag passt zu version.py" oben abgelehnt hat.
  # Getaggt mit der genauen Version und mit "1" (alle Helfer mit derselben Schnittstelle; das nimmt
  # deploy/compose.standalone-mit-helfer.yml). "1" wandert erst, wenn der Selbsttest auf beiden Plattformen am
  # veröffentlichten Digest bestanden ist, und nur für die höchste fertige Version (wie `latest` beim Dashboard).
  updater-image:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Version aus dem Tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "VERSION=${REF_NAME#v}" >> "$GITHUB_ENV"

      # Wie "Tag passt zu version.py" im Job oben, nur fuer die Version des Helfers (`__version__` in
      # deploy/updater/nodvard_deck_updater/__init__.py, im Status `helper_version`): Eine fertige Version muss genau sie
      # sein, bei einer Vorabversion zaehlt der Teil vor dem "-" (groesser oder gleich, nie kleiner). Sonst meldete der
      # Helfer im Dashboard eine andere Version als sein Image. Gelesen ueber den Syntaxbaum, ohne das Paket auszufuehren.
      - name: Tag passt zur Version des Helfers
        run: |
          code="$(python3 -c 'import ast
          tree = ast.parse(open("deploy/updater/nodvard_deck_updater/__init__.py", encoding="utf-8").read())
          found = [n.value.value for n in tree.body if isinstance(n, ast.Assign) and isinstance(n.value, ast.Constant)
                   and [getattr(x, "id", None) for x in n.targets] == ["__version__"]]
          print(found[0] if len(found) == 1 else "")')"
          base="${VERSION%%-*}"
          if [ "$base" = "$VERSION" ]; then
            [ -n "$code" ] && [ "$VERSION" = "$code" ] && ok=1 || ok=0
          else
            python3 -c 'import re, sys
          def key(v):
              m = re.fullmatch(r"(\d+)\.(\d+)\.(\d+)", v)
              return tuple(map(int, m.groups())) if m else None
          num = r"(0|[1-9][0-9]{0,8})"
          pre = num + r"\." + num + r"\." + num + r"-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*"
          full_ok = re.fullmatch(pre, sys.argv[3], re.ASCII) is not None
          base, code = key(sys.argv[1]), key(sys.argv[2])
          sys.exit(0 if full_ok and base and code and base >= code else 1)' "$base" "$code" "$VERSION" && ok=1 || ok=0
          fi
          if [ "$ok" != 1 ]; then
            echo "Tag v$VERSION passt nicht zur Version des Update-Helfers ($code) in deploy/updater/nodvard_deck_updater/__init__.py." >&2
            echo "Fertige Version: zuerst python scripts/release.py <version> mergen (hebt beide an), dann taggen." >&2
            exit 1
          fi
          echo "Tag v$VERSION passt zur Version des Helfers ($code)."

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags und Labels festlegen
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5.10.0
        with:
          images: ${{ env.IMAGE_NAME }}-updater
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=Nodvard Deck Update-Helfer
            org.opencontainers.image.description=Aktualisiert Nodvard Deck auf Wunsch aus dem Dashboard (Compose-Installationen).
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
            org.opencontainers.image.version=${{ env.VERSION }}

      # Ohne Build-Cache: Das Image ist klein und in Sekunden gebaut, und es laeuft mit Zugriff auf Docker.
      - name: Bauen und veroeffentlichen
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          file: deploy/updater/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.VERSION }}

      # Genau das veroeffentlichte Image (per Digest) so starten wie im Betrieb: ohne Netz, nur lesbar, ohne Rechte,
      # mit der Prozessgrenze der Compose-Datei. Die Speichergrenze prueft nur der CI-Job `updater` (ohne Emulator):
      # Unter QEMU (arm64) zaehlte der Emulator selbst mit, und ein Fehlalarm hielte das Tag 1 auf.
      # Image und Digest kommen ueber die Umgebung, nichts wird in den Befehl eingesetzt.
      - name: Selbsttest am Digest (amd64 und arm64)
        env:
          IMAGE: ${{ env.IMAGE_NAME }}-updater
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            docker run --rm --platform "$platform" --network none --read-only --cap-drop ALL \
              --security-opt no-new-privileges --pids-limit 32 "$IMAGE@$DIGEST" --selftest
            # Vor der naechsten Plattform wieder entfernen: Docker kann denselben Digest nicht fuer eine zweite
            # Plattform ablegen ("cannot overwrite digest"), der arm64-Test lief deshalb bei 0.7.0 nie.
            docker image rm "$IMAGE@$DIGEST" >/dev/null
          done

      - name: Tag 1 setzen
        if: ${{ needs.image.outputs.newest == 'true' }}
        env:
          IMAGE: ${{ env.IMAGE_NAME }}-updater
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker buildx imagetools create --tag "$IMAGE:1" "$IMAGE@$DIGEST"

  # Nodvard Dock: dasselbe Dockerfile, nur mit dem Modul docker. Erst nach dem Dashboard-Image (`needs`), also nur zu
  # einem Tag, das zu version.py passt. `latest` (das nimmt deploy/nodvard-dock/compose.yml) wandert erst, wenn die
  # Prüfung am veröffentlichten Digest auf beiden Plattformen bestanden ist, und nur für die höchste fertige Version.
  dock-image:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Version aus dem Tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "VERSION=${REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130  # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags und Labels festlegen
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051  # v5.10.0
        with:
          images: ${{ env.DOCK_IMAGE_NAME }}
          flavor: |
            latest=false
          # Kein rollendes `X.Y`: Es wanderte schon vor der Prüfung, und die Compose-Datei nimmt nur `latest`.
          tags: |
            type=semver,pattern={{version}}
          labels: |
            org.opencontainers.image.title=Nodvard Dock
            org.opencontainers.image.description=Container-Verwaltung für Docker: Nodvard Deck nur mit dem Modul Docker.
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=PolyForm-Noncommercial-1.0.0
            org.opencontainers.image.version=${{ env.VERSION }}

      # Liest den Cache des Dashboard-Images mit (dieselben Stufen bis zur Auswahl der Module), schreibt aber in einen
      # eigenen, damit keiner den anderen verdrängt.
      - name: Bauen und veröffentlichen
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ env.VERSION }}
            IMAGE=${{ env.DOCK_IMAGE_NAME }}
            NODVARD_DECK_EXTENSIONS=docker
          cache-from: |
            type=gha
            type=gha,scope=dock
          cache-to: type=gha,scope=dock,mode=max

      # Wie im CI-Job `dock-image`: nur das Modul docker, kein Tesseract. Ein einziger Aufruf je Plattform, damit ein
      # gescheiterter Start nicht als "kein Tesseract" durchgeht. Image und Digest kommen über die Umgebung.
      - name: Prüfung am Digest (amd64 und arm64)
        env:
          IMAGE: ${{ env.DOCK_IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          for platform in linux/amd64 linux/arm64; do
            found="$(docker run --rm --platform "$platform" --network none --entrypoint sh "$IMAGE@$DIGEST" \
              -c 'cd /app/extensions && ls -d */ | tr -d / | tr "\n" " "; command -v tesseract >/dev/null && echo tesseract; true')"
            if [ "$found" != "_shared docker " ]; then
              echo "Erwartet war nur das Modul docker, im Image für $platform liegt: $found" >&2
              exit 1
            fi
            # Wie beim Helfer: Docker legt denselben Digest nicht für eine zweite Plattform ab.
            docker image rm "$IMAGE@$DIGEST" >/dev/null
          done

      - name: Tag latest setzen
        if: ${{ needs.image.outputs.newest == 'true' }}
        env:
          IMAGE: ${{ env.DOCK_IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"

  # Entwurf des GitHub-Releases zum Tag mit der Compose-Datei mit Helfer, fest auf den Digest, den der Selbsttest
  # geprüft hat (scripts/release_helper_assets.py; bei der höchsten fertigen Version zeigt auch Tag 1 darauf). Im
  # Repository bleibt `:1`, kein Commit nach dem Release. Nur für fertige Versionen, auch für Patches älterer Reihen.
  # Der Job veröffentlicht nie und setzt nie „latest“: Den Entwurf prüft ein Mensch und klickt „Publish release“. Der
  # einzige Job mit Schreibrecht auf das Repository, ohne Zugriff auf die Registry; der Token steht nur im letzten
  # Schritt (dort laufen `gh` und `release_helper_assets.py merge` vom Tag) und nicht in der Arbeitskopie
  # (`persist-credentials: false`). Titel und Text eines neuen Entwurfs kommen aus docs/release-notes/<version>.md im
  # Tag.
  helper-release:
    needs: updater-image
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - name: Version aus dem Tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: echo "VERSION=${REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Dateien fürs Release
        env:
          IMAGE: ${{ env.IMAGE_NAME }}-updater
          DIGEST: ${{ needs.updater-image.outputs.digest }}
        run: |
          [ -f "docs/release-notes/$VERSION.md" ] || echo "::warning::docs/release-notes/$VERSION.md fehlt im Tag: Ein neuer Entwurf bekommt nur Titel und Digest."
          python3 scripts/release_helper_assets.py files --version "$VERSION" --image "$IMAGE" --digest "$DIGEST" --out "$RUNNER_TEMP/release"

      # Gibt es zum Tag schon einen Entwurf oder ein Release (von Hand vorbereitet oder ein zweiter Lauf), bleiben Titel,
      # Status und Text bis auf den Abschnitt mit dem Digest; `gh release view` findet auch Entwürfe.
      - name: Entwurf anlegen oder Release ergänzen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          out="$RUNNER_TEMP/release"
          if gh release view "$TAG" --json body --jq .body > "$out/current.md" 2> "$out/view.err"; then
            python3 scripts/release_helper_assets.py merge --existing "$out/current.md" --section "$out/helper-digest.md" --out "$out/release-notes.md"
            gh release upload "$TAG" "$out/compose.standalone-mit-helfer.yml" --clobber
            gh release edit "$TAG" --notes-file "$out/release-notes.md"
            echo "::notice::$TAG ergänzt: Datei angehängt, Abschnitt mit dem Digest gesetzt. Titel, übriger Text und Status bleiben."
          elif grep -q "release not found" "$out/view.err"; then
            gh release create "$TAG" --draft --verify-tag --title "$(cat "$out/release-title.txt")" --notes-file "$out/release-notes.md" "$out/compose.standalone-mit-helfer.yml"
            echo "::notice::Entwurf für $TAG angelegt. Veröffentlichen: auf GitHub unter Releases den Entwurf prüfen, dann „Publish release“."
          else
            cat "$out/view.err" >&2
            exit 1
          fi
