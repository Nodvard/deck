[extension]
id          = "backups"
name        = "Backups"
version     = "0.1.0"
api_version = "0.1.0"
author      = "Nodvard"
description = "Nur für Proxmox: zeigt alle Backups deiner Proxmox-Server auf einen Blick, warnt bei fehlgeschlagenen oder fehlenden Sicherungen und bei knappem Speicher. Backup-Jobs lassen sich anlegen, ändern und neu starten."
icon        = "database-backup"
category    = "servers"
sort_order  = 50
entrypoint  = "nodvard_deck_ext_backups:Extension"
frontend    = "frontend/dist/index.js"

permissions = [
  "net.outbound",
  "net.outbound.insecure_tls",
  "hosts.read",
  "hosts.execute",
  "secrets.read:backups-*",
  "schedule.register",
  "notify.send",
]

[settings]
schema = "settings.schema.json"
